[plugin]

name="dot-log"
description="The sink layer for DotLog. Rotating files, an in-memory ring for the console and for bug reports, RFC 5424 syslog, a SQL table through any driver, and batched HTTP shipping in the wire formats the log services actually accept. Gating, redaction, batching and backpressure happen once, in front of every target. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_log_plugin.gd"
